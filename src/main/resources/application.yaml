server:
  port: 8081

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  name: Task Manager Application
  version: 1.0.0
  api:
    version: 2.0.0
  upload:
    dir: uploads

---
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    com.example: DEBUG
    org.springframework: INFO
server:
  port: 8082
app:
  name: Task Manager DEV

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  level:
    com.example: WARN
    org.springframework: WARN
server:
  port: 80
app:
  name: Task Manager PROD